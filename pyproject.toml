[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogi-analysis"
version = "0.1.0"
description = "A small scientific desktop analysis workspace"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=1.26,<3", "scipy>=1.13,<2", "matplotlib>=3.8,<4", "h5py>=3.11,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rogi = "rogi.ui:main"

[tool.setuptools.packages.find]
include = ["rogi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
